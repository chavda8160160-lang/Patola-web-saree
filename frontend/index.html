    <style>
      /* Royal Heritage Initial Splash Preloader */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: radial-gradient(circle at center, #3d050d 0%, #1a0206 100%);
      }
      .heritage-preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
        color: #d4af37;
      }
      .preloader-emblem {
        position: relative;
        width: 110px;
        height: 110px;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preloader-ring {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 2px dashed rgba(212, 175, 55, 0.6);
        animation: preloaderSpin 14s linear infinite;
      }
      .preloader-glow {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        box-shadow: 0 0 35px rgba(212, 175, 55, 0.45);
        animation: preloaderPulse 2.5s ease-in-out infinite;
      }
      .preloader-logo {
        width: 86px;
        height: 86px;
        object-fit: contain;
        border-radius: 50%;
        border: 2px solid #d4af37;
        padding: 5px;
        background: rgba(45, 4, 10, 0.95);
        z-index: 2;
      }
      .preloader-title {
        font-size: 1.45rem;
        letter-spacing: 4px;
        color: #d4af37;
        margin: 0 0 0.4rem 0;
        font-weight: 700;
        text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      }
      .preloader-sub {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 0.76rem;
        letter-spacing: 2.5px;
        color: #f1e1c6;
        margin: 0 0 0.6rem 0;
        text-transform: uppercase;
      }
      .preloader-gujarati {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 0.86rem;
        color: #c5a059;
        margin-bottom: 1.5rem;
      }
      .preloader-track {
        width: 220px;
        height: 4px;
        background: rgba(212, 175, 55, 0.2);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
      }
      .preloader-bar {
        position: absolute;
        top: 0;
        left: -50%;
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #d4af37, #fff4cc, #d4af37, transparent);
        border-radius: 999px;
        animation: preloaderTravel 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes preloaderSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes preloaderPulse {
        0%, 100% { opacity: 0.4; transform: scale(0.96); }
        50% { opacity: 0.9; transform: scale(1.06); }
      }
      @keyframes preloaderTravel {
        0% { left: -50%; }
        100% { left: 100%; }
      }
